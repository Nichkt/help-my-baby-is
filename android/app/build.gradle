plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nicholaston.helpmybabyis'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nicholaston.helpmybabyis'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}
